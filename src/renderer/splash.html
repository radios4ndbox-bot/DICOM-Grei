<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'" />
<title>DICOM Importer — Splash</title>
<link rel="icon" type="image/svg+xml" href="assets/globe.svg" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 100vh;
    background: radial-gradient(120% 120% at 50% 40%, #f4fbfa 0%, #e9f5ff 70%, #dfeefc 100%);
    font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  .splash-credit {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 8px;
    text-align: center;
    font-size: 11px;
    color: #a9bcc2;
  }

  /* stage sized to the artwork band only (no empty square around it) */
  /* la finestra è quella del tool (1320×800): logo grande, con margine per
     spirale e onde che sbordano dalla fascia */
  .stage { width: min(62vw, 720px); aspect-ratio: 348 / 98; }
  .logo  { width: 100%; height: 100%; display: block; }

  /* La spirale e le onde escono dalla fascia del viewBox (alta 98): si
     lasciano sbordare invece di allargare lo stage. */
  .logo { overflow: visible; }

  /* Tutto ruota e pulsa attorno al centro del globo (261.7, 228.1). */
  .spiral, .ring, .core, .globe, .globe .seg, .ripple {
    transform-box: view-box;
    transform-origin: 261.7px 228.1px;
  }

  /* ---------------------------------------------------------------
     1. SPIRALE — anelli annidati che si avvitano (0 – 2.1 s)
     --------------------------------------------------------------- */
  .spiral { animation: spiral-life 2.1s cubic-bezier(0.3, 0.7, 0.4, 1) both; }
  @keyframes spiral-life {
      0% { opacity: 0; transform: scale(0.3); filter: blur(3px); }
     20% { opacity: 1; filter: blur(0); }
     70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.55); }
  }

  .ring {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 30 20; /* due archi per anello, su pathLength=100 */
    animation: twist 2.1s cubic-bezier(0.25, 1, 0.5, 1) both;
  }
  .ring:nth-child(odd)  { stroke: #00b6cd; }
  .ring:nth-child(even) { stroke: #00d7ad; }
  .ring:nth-child(1) { animation-delay: 0.00s; }
  .ring:nth-child(2) { animation-delay: 0.06s; }
  .ring:nth-child(3) { animation-delay: 0.12s; }
  .ring:nth-child(4) { animation-delay: 0.18s; }
  .ring:nth-child(5) { animation-delay: 0.24s; }
  .ring:nth-child(6) { animation-delay: 0.30s; }
  @keyframes twist {
      0% { transform: rotate(0deg)   scale(0.8);  }
     50% { transform: rotate(540deg) scale(1.05); }
    100% { transform: rotate(900deg) scale(0.9);  }
  }

  .core {
    fill: #00c6bd;
    filter: drop-shadow(0 0 3px #00d2c8);
    animation: core-pulse 0.7s ease-in-out infinite alternate;
  }
  @keyframes core-pulse {
    from { transform: scale(1);   }
    to   { transform: scale(1.6); }
  }

  /* ---------------------------------------------------------------
     2. GLOBO — gli spicchi arrivano girando dalla spirale (1.3 – 2.2 s)
     --------------------------------------------------------------- */
  .globe .seg { animation: seg-spiral 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
  .globe .seg:nth-child(1) { animation-delay: 1.30s; }
  .globe .seg:nth-child(2) { animation-delay: 1.35s; }
  .globe .seg:nth-child(3) { animation-delay: 1.40s; }
  .globe .seg:nth-child(4) { animation-delay: 1.45s; }
  .globe .seg:nth-child(5) { animation-delay: 1.50s; }
  .globe .seg:nth-child(6) { animation-delay: 1.55s; }
  .globe .seg:nth-child(7) { animation-delay: 1.60s; }
  .globe .seg:nth-child(8) { animation-delay: 1.65s; }
  .globe .seg:nth-child(9) { animation-delay: 1.70s; }
  @keyframes seg-spiral {
    from { opacity: 0; transform: rotate(-220deg) scale(0.3); }
    to   { opacity: 1; transform: rotate(0deg)    scale(1);   }
  }

  /* ---------------------------------------------------------------
     3. PULSE — il globo pulsa e manda due onde (2.2 s)
     --------------------------------------------------------------- */
  .globe { animation: globe-pulse 0.7s ease-out 2.2s both; }
  @keyframes globe-pulse {
      0% { transform: scale(1);    }
     35% { transform: scale(1.12); }
    100% { transform: scale(1);    }
  }

  .ripple {
    fill: none;
    stroke: #00c6bd;
    stroke-width: 1.6;
    vector-effect: non-scaling-stroke;
    opacity: 0;
    animation: ripple 1.2s cubic-bezier(0.2, 0.6, 0.35, 1) forwards;
  }
  .ripple:nth-of-type(1) { animation-delay: 2.25s; }
  .ripple:nth-of-type(2) { animation-delay: 2.45s; }
  @keyframes ripple {
      0% { opacity: 0.9; transform: scale(1);   }
    100% { opacity: 0;   transform: scale(6.5); }
  }

  /* ---------------------------------------------------------------
     4. LETTERE — DIC e M rivelate dal fronte dell'onda (2.3 – 3.3 s)
     --------------------------------------------------------------- */
  .reveal-disc { r: 0; animation: reveal 1s cubic-bezier(0.2, 0.6, 0.35, 1) 2.3s forwards; }
  @keyframes reveal {
    from { r: 0;     }
    to   { r: 200px; }
  }

  /* dove passa l'onda la lettera nasce teal e si scurisce */
  .wordmark path { fill: #1a1a1a; animation: ink 1.4s ease-out 2.3s both; }
  @keyframes ink {
    from { fill: #00b6cd; }
    to   { fill: #1a1a1a; }
  }

  /* sottotitolo: dissolvenza, per ultimo */
  .subtitle {
    opacity: 0;
    animation: fade-in 0.5s ease-out 3.1s both;
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .spiral, .ripple { display: none; }
    .globe, .globe .seg, .subtitle { animation: none; opacity: 1; }
    .reveal-disc { animation: none; r: 200px; }
    .wordmark path { animation: none; }
  }
</style>
</head>
