appId: it.desio.dicomimporttool
productName: DICOM Import Tool
copyright: Desio

asar: false

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - node_modules/dicom-parser/**/*

# App autosufficiente: resources/dcmtk/bin contiene storescu.exe (DCMTK
# 3.7.0 win64) + le sue DLL (dcmnet, dcmdata, dcmtls, oflog, ofstd,
# oficonv). Vengono copiate in <resources>/dcmtk; config.js risolve
# process.resourcesPath/dcmtk/bin/storescu.exe.
extraResources:
  - from: resources/dcmtk
    to: dcmtk

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}
