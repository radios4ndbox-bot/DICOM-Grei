# appId resta quello di prima di DICOM Grei e non va cambiato: da lì viene la
# chiave di registro dell'installazione, ed è così che l'installer nuovo
# aggiorna quello vecchio (stessa cartella, nessun doppione in «App installate»).
appId: it.desio.dicomimporttool
# Nome visibile: installer, exe, collegamenti. La cartella delle impostazioni
# (%APPDATA%\dicom-import-tool\settings.json) non dipende da qui: è fissata
# in main.js (USER_DATA_DIR).
productName: DICOM Grei
copyright: Desio

asar: false

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - build/icon.ico
  - package.json
  - node_modules/dicom-parser/**/*
  # Codec del viewer (dicomDecode.js). Solo ciò che gira: di ogni pacchetto
  # il decoder e il suo .wasm, non i sorgenti, i test e gli encoder.
  - node_modules/jpeg-lossless-decoder-js/package.json
  - node_modules/jpeg-lossless-decoder-js/LICENSE
  - node_modules/jpeg-lossless-decoder-js/release/cjs/**/*
  - node_modules/@cornerstonejs/codec-charls/package.json
  - node_modules/@cornerstonejs/codec-charls/LICENSE
  - node_modules/@cornerstonejs/codec-charls/dist/charlswasm_decode.*
  - node_modules/@cornerstonejs/codec-openjpeg/package.json
  - node_modules/@cornerstonejs/codec-openjpeg/dist/openjpegwasm_decode.*
  - node_modules/@cornerstonejs/codec-libjpeg-turbo-8bit/package.json
  - node_modules/@cornerstonejs/codec-libjpeg-turbo-8bit/dist/libjpegturbowasm_decode.*

# App autosufficiente: resources/dcmtk/bin contiene storescu.exe (DCMTK
# 3.7.0 win64) + le sue DLL (dcmnet, dcmdata, dcmtls, oflog, ofstd,
# oficonv) + il runtime Visual C++ (msvcp140, vcruntime140,
# vcruntime140_1), che non fa parte di Windows e sulle postazioni senza
# permessi di amministratore non si può installare. Vengono copiate in
# <resources>/dcmtk; config.js risolve process.resourcesPath/dcmtk/bin/storescu.exe.
extraResources:
  - from: resources/dcmtk
    to: dcmtk

win:
  target:
    - nsis
  icon: build/icon.ico

  # ------------------------------------------------------------------
  # FIRMA DIGITALE — unico modo per essere "fidati" da Windows Defender
  # SmartScreen. Senza firma ogni nuova build è un binario sconosciuto e
  # mostra "Windows ha protetto il PC".
  #
  # electron-builder firma automaticamente exe + installer se in CI sono
  # presenti le variabili d'ambiente (GitHub Actions → repo secrets):
  #   CSC_LINK            certificato .pfx in base64, oppure un URL
  #   CSC_KEY_PASSWORD    password del .pfx
  #
  # Dal giugno 2023 le CA non rilasciano più .pfx per i certificati nuovi:
  # la chiave deve stare su token HSM o su un servizio cloud. Con Azure
  # Trusted Signing si usa invece:
  #   azureSignOptions:
  #     publisherName: "<nome esatto sul certificato>"
  #     endpoint: https://<regione>.codesigning.azure.net
  #     certificateProfileName: <profilo>
  #     codeSigningAccountName: <account>
  # più le variabili AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET.
  # ------------------------------------------------------------------

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}
