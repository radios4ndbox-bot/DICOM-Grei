appId: it.desio.dicomimporttool
productName: DICOM Import Tool
copyright: Desio

asar: false

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - node_modules/dicom-parser/**/*

# Per rendere l'app autosufficiente: crea ./resources/dcmtk/bin con
# storescu.exe + le sue DLL, poi aggiungi qui sotto (electron-builder
# fallisce se `from` non esiste, quindi tienilo commentato finché la
# cartella non c'è). config.js cerca già resources/dcmtk/bin/storescu.exe.
# extraResources:
#   - from: resources/dcmtk
#     to: dcmtk

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}
