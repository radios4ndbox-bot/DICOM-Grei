appId: it.desio.dicomimporttool
productName: DICOM Import Tool
copyright: Desio

asar: false

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - build/icon.ico
  - package.json
  - node_modules/dicom-parser/**/*

# App autosufficiente: resources/dcmtk/bin contiene storescu.exe (DCMTK
# 3.7.0 win64) + le sue DLL (dcmnet, dcmdata, dcmtls, oflog, ofstd,
# oficonv). Vengono copiate in <resources>/dcmtk; config.js risolve
# process.resourcesPath/dcmtk/bin/storescu.exe.
extraResources:
  - from: resources/dcmtk
    to: dcmtk

win:
  target:
    - nsis
  icon: build/icon.ico

  # ------------------------------------------------------------------
  # FIRMA DIGITALE — unico modo per essere "fidati" da Windows Defender
  # SmartScreen. Senza firma ogni nuova build è un binario sconosciuto e
  # mostra "Windows ha protetto il PC".
  #
  # electron-builder firma automaticamente exe + installer se in CI sono
  # presenti le variabili d'ambiente (GitHub Actions → repo secrets):
  #   CSC_LINK            certificato .pfx in base64, oppure un URL
  #   CSC_KEY_PASSWORD    password del .pfx
  #
  # Dal giugno 2023 le CA non rilasciano più .pfx per i certificati nuovi:
  # la chiave deve stare su token HSM o su un servizio cloud. Con Azure
  # Trusted Signing si usa invece:
  #   azureSignOptions:
  #     publisherName: "<nome esatto sul certificato>"
  #     endpoint: https://<regione>.codesigning.azure.net
  #     certificateProfileName: <profilo>
  #     codeSigningAccountName: <account>
  # più le variabili AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET.
  # ------------------------------------------------------------------

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}
